name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Both runners on purpose: the script carries BSD/GNU dual paths for
    # date/stat, and only macOS exercises the BSD branches.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y jq shellcheck bats

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core shellcheck jq || true

      - name: shellcheck
        run: shellcheck statusline.sh doctor.sh install.sh

      - name: bats
        run: bats tests/

  # The README promises Windows through WSL or Git Bash, and until this job
  # existed nothing ever ran the script there — so a Git Bash path or `stat`
  # difference could sit broken until a user reported it. Non-blocking on
  # purpose: a Windows runner is expected to surface real differences, and a
  # newly-red check on every push is friction, not information. Read what it
  # reports, fix what is worth fixing, and make it blocking once it is green.
  windows-git-bash:
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install bats
        run: |
          git clone --depth 1 https://github.com/bats-core/bats-core.git "$RUNNER_TEMP/bats"

      - name: bats (Git Bash)
        run: |
          "$RUNNER_TEMP/bats/bin/bats" tests/
